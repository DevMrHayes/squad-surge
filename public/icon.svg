<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#1e293b" stroke-width="4"/>
  <!-- Tactical Highway lines -->
  <line x1="256" y1="64" x2="256" y2="448" stroke="#334155" stroke-width="8" stroke-dasharray="24 24"/>
  <line x1="160" y1="64" x2="160" y2="448" stroke="#1e293b" stroke-width="4"/>
  <line x1="352" y1="64" x2="352" y2="448" stroke="#1e293b" stroke-width="4"/>
  <!-- Tactical Chevron Squad -->
  <polygon points="256,128 368,280 296,280 256,220 216,280 144,280" fill="url(#neon)" filter="url(#glow)"/>
  <polygon points="256,260 336,368 288,368 256,324 224,368 176,368" fill="#38bdf8" opacity="0.8"/>
  <circle cx="256" cy="420" r="16" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="208" cy="436" r="12" fill="#06b6d4"/>
  <circle cx="304" cy="436" r="12" fill="#f59e0b"/>
</svg>
